
#Общие настройки. Документация: https://srpc.fdd-docs.com/introduction/
[general]
	#ID приложения Discord, которое будет использоваться
	applicationID = "1130503170309771374"
	#Включить/выключить мод
	enabled = true
	#Включить/выключить режим отладки. ВНИМАНИЕ: МОЖЕТ ЗАСПАМИТЬ ЛОГ!
	debugging = false
	#Определять совместимые лаунчеры, чтобы использовать их название и иконку в конфиге
	launcherIntegration = false
	#Разрешить использовать локальные файлы изображений как иконки RPC
	rpcImageServer = false
	#URL сервера изображений RPC для локальных картинок. После изменения нужен перезапуск
	rpcImageServerUrl = "https://rpcavatar.firstdark.dev"
	#Внутренний номер версии. НЕ ТРОГАТЬ!
	version = 27

#Событие: загрузка игры
[init]
	#Включить/выключить событие загрузки игры
	enabled = true

	[[init.presence]]
		type = "PLAYING"
		description = "Minecraft загружается"
		state = "Игра запускается..."
		largeImageKey = ["mclogonew"]
		largeImageText = "t.me/ambminecraft"
		smallImageKey = ["mclogo"]
		smallImageText = "Установлено модов: {{game.mods}}"
		streamingActivityUrl = "https://twitch.tv/twitch"

		[[init.presence.buttons]]
			label = "Присоединиться"
			url = "https://www.ambminecraft.ru/"

#Событие: главное меню
[main_menu]
	#Включить/выключить событие главного меню
	enabled = true

	[[main_menu.presence]]
